<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stockIAte | Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
<script src="tema.js?v=1"></script>

<!-- ===== Modo prueba (atajo de testeo) — estilos =========================
     Van acá y no en styles.css a propósito: así todo el atajo queda
     contenido en este archivo y se borra de una sola pasada. -->
<style>
.demo-box{
    margin-top:28px;
    padding:16px;
    border:1px dashed rgba(245, 158, 11, 0.35);
    border-radius:var(--radio-chico);
    background:rgba(245, 158, 11, 0.06);
}
.demo-titulo{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-weight:600;
    color:var(--alerta);
}
.demo-sub{
    margin:6px 0 12px;
    font-size:13px;
    color:var(--gris-tenue);
}
.demo-botones{
    display:flex;
    gap:8px;
}
.demo-botones .btn{
    padding:11px 6px;
    font-size:13px;
}
</style>
</head>
<body>

<div class="app">

<header>
    <div>
        <div class="marca" id="btn-inicio" style="cursor:pointer;">
         stock<em>IA</em>te
         </div>
        <div class="modulo-tag">Iniciar sesión</div>
    </div>
    <button type="button" class="toggle-tema" onclick="window.stockiateTema.alternar()" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
      <span class="toggle-tema-knob">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F0EAF7" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
      </span>
    </button>
</header>

<main>
<section class="landing" style="text-align:left;">

    <h1>Bienvenido de vuelta</h1>
    <p class="sub">Ingresá con tu email y contraseña.</p>

    <div id="mensaje" class="auth-mensaje"></div>

    <form id="form-login" class="auth-form" novalidate>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-submit" class="btn btn-primario">Ingresar</button>
    </form>

    <p class="auth-footer">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>

    <!-- ===== Modo prueba (atajo de testeo) =============================
         Entra sin registrarse ni iniciar sesión. Arranca oculto y se
         muestra solo si sesion_demo.php responde habilitado:true, así
         apagar el atajo es cambiar una sola línea en el PHP.
         Para sacarlo del todo: borrar este bloque, el <style> del <head>,
         el JS marcado más abajo y sesion_demo.php. -->
    <div id="modo-prueba" class="demo-box" hidden>
        <div class="demo-titulo">Modo prueba</div>
        <p class="demo-sub">Saltear el login y entrar directo como:</p>
        <div class="demo-botones">
            <button type="button" class="btn btn-secundario" data-rol="repositor">Repositor</button>
            <button type="button" class="btn btn-secundario" data-rol="cajero">Cajero</button>
            <button type="button" class="btn btn-secundario" data-rol="dueño">Administrador</button>
        </div>
    </div>

</section>
</main>

</div>

<script src="config.js?v=1"></script>
<script src="auth.js?v=5"></script>
<script>
if (obtenerUsuarioSesion()) {
    window.location.href = rutaParaRol(obtenerUsuarioSesion().rol);
}

document.getElementById("btn-inicio").addEventListener("click", () => {
    window.location.href = "landing_page.html";
});

const URL_BASE = ".";
const HEADERS_NGROK = STOCKIATE_HEADERS; // definido en config.js

const form = document.getElementById("form-login");
const mensaje = document.getElementById("mensaje");
const btnSubmit = document.getElementById("btn-submit");

function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = `auth-mensaje activo ${tipo}`;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    mensaje.className = "auth-mensaje";
    btnSubmit.disabled = true;
    btnSubmit.textContent = "Ingresando...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const resp = await fetchPublico(`${URL_BASE}/iniciar_sesion.php`, {
            method: "POST",
            headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
        });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
            mostrarMensaje(data.mensaje || "No se pudo iniciar sesión.", "error");
            return;
        }

        guardarUsuarioSesion(data.usuario);
        window.location.href = rutaParaRol(data.usuario.rol);
    } catch (err) {
        mostrarMensaje(mensajeDeError(err), "error");
    } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Ingresar";
    }
});

// ===== Modo prueba (atajo de testeo) — JS ==========================
// Borrar de acá hasta el cierre de este bloque de script para sacar el atajo.
const bloqueDemo = document.getElementById("modo-prueba");

// Le preguntamos al backend si el atajo está habilitado. Si el archivo no
// existe, está apagado o el server no responde, el bloque queda oculto y
// el login se comporta como siempre.
fetchPublico(`${URL_BASE}/sesion_demo.php`, { headers: HEADERS_NGROK })
    .then((r) => r.json())
    .then((d) => { if (d && d.habilitado) bloqueDemo.hidden = false; })
    .catch(() => {});

bloqueDemo.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-rol]");
    if (!btn) return;

    const textoOriginal = btn.textContent;
    mensaje.className = "auth-mensaje";
    bloqueDemo.querySelectorAll("button").forEach((b) => (b.disabled = true));
    btn.textContent = "Entrando...";

    try {
        const resp = await fetchPublico(`${URL_BASE}/sesion_demo.php`, {
            method: "POST",
            headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
            body: JSON.stringify({ rol: btn.dataset.rol }),
        });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
            mostrarMensaje(data.mensaje || "No se pudo entrar en modo prueba.", "error");
            return;
        }

        guardarUsuarioSesion(data.usuario);
        window.location.href = rutaParaRol(data.usuario.rol);
    } catch (err) {
        mostrarMensaje(mensajeDeError(err), "error");
    } finally {
        bloqueDemo.querySelectorAll("button").forEach((b) => (b.disabled = false));
        btn.textContent = textoOriginal;
    }
});
</script>

</body>
</html>
