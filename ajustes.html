<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>stockIAte — Ajustes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js"></script>
    <script>
      // Sincrónico y en <head>, igual que el resto de las páginas de rol.
      // Cualquier rol logueado puede entrar: es la configuración de su
      // propia cuenta, no un módulo restringido.
      var usuarioSesion = exigirSesion(["repositor", "cajero", "dueño"]);
    </script>
</head>
<body>

<div class="app">
  <header>
    <div>
       <div class="marca" id="btn-inicio" style="cursor:pointer;">
        stock<em>IA</em>te
       </div>
      <div class="modulo-tag">Ajustes</div>
    </div>

    <div class="menu-container">
      <button id="btn-menu" class="btn-menu">⋯</button>

      <div id="menu-desplegable" class="menu-desplegable">
        <button type="button" onclick="window.location.href='landing_page.html'">Inicio</button>
        <button type="button" id="btn-menu-repositor" onclick="window.location.href='repositor.html'">Repositor</button>
        <button type="button" id="btn-menu-cajero" onclick="window.location.href='cajero.html'">Cajero</button>
        <button type="button" id="btn-menu-administrador" onclick="window.location.href='administrador.html'">Administrador</button>
        <button type="button" id="btn-menu-cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main>

    <div>
      <h1>Ajustes</h1>
      <p class="sub">Tu cuenta y las preferencias del negocio, en un solo lugar.</p>
    </div>

    <!-- ================= MI CUENTA ================= -->
    <div class="item-card">
      <h2 class="ajustes-titulo">Mi cuenta</h2>
      <div id="mensaje-cuenta" class="auth-mensaje"></div>
      <form id="form-cuenta" class="auth-form" novalidate>
        <div class="fila-doble">
          <div>
            <label for="cuenta-nombre">Nombre</label>
            <input type="text" id="cuenta-nombre" name="nombre" autocomplete="given-name" required>
          </div>
          <div>
            <label for="cuenta-apellido">Apellido</label>
            <input type="text" id="cuenta-apellido" name="apellido" autocomplete="family-name" required>
          </div>
        </div>
        <div>
          <label>Email</label>
          <p class="campo-solo-lectura" id="cuenta-email"></p>
        </div>
        <div>
          <label>Rol</label>
          <p class="campo-solo-lectura" id="cuenta-rol"></p>
        </div>
        <button type="submit" id="btn-guardar-cuenta" class="btn btn-primario">Guardar cambios</button>
      </form>
    </div>

    <!-- ================= SEGURIDAD ================= -->
    <div class="item-card">
      <h2 class="ajustes-titulo">Seguridad</h2>
      <div id="mensaje-password" class="auth-mensaje"></div>
      <form id="form-password" class="auth-form" novalidate>
        <div>
          <label for="password-actual">Contraseña actual</label>
          <input type="password" id="password-actual" autocomplete="current-password" required>
        </div>
        <div>
          <label for="password-nueva">Contraseña nueva <span class="campo-opcional-tag">Mínimo 6 caracteres</span></label>
          <input type="password" id="password-nueva" autocomplete="new-password" minlength="6" required>
        </div>
        <div>
          <label for="password-nueva-confirmar">Confirmar contraseña nueva</label>
          <input type="password" id="password-nueva-confirmar" autocomplete="new-password" required>
        </div>
        <button type="submit" id="btn-cambiar-password" class="btn btn-primario">Cambiar contraseña</button>
      </form>
    </div>

    <!-- ================= PREFERENCIAS DEL NEGOCIO (sólo dueño) ================= -->
    <div class="item-card" id="card-preferencias">
      <h2 class="ajustes-titulo">Preferencias del negocio</h2>
      <div id="mensaje-config" class="auth-mensaje"></div>
      <form id="form-config" class="auth-form" novalidate>
        <div>
          <label for="umbral-vencimiento">Alertar vencimientos con esta anticipación (días)</label>
          <input type="number" id="umbral-vencimiento" min="0" step="1" required>
        </div>
        <button type="submit" id="btn-guardar-config" class="btn btn-primario">Guardar preferencia</button>
      </form>
    </div>

    <!-- ================= SESIÓN ================= -->
    <div class="item-card">
      <h2 class="ajustes-titulo">Sesión</h2>
      <p class="sub" id="sesion-info" style="margin:0 0 4px;"></p>
      <button type="button" id="btn-cerrar-sesion-ajustes" class="btn btn-secundario">Cerrar sesión</button>
    </div>

  </main>

  <footer>stockIAte · Tu cuenta y las preferencias del negocio</footer>
</div>

<script>
  const URL_BASE = "https://atrium-overtime-deluxe.ngrok-free.dev/stockiate/tesis_enzo";
  const HEADERS_NGROK = { "ngrok-skip-browser-warning": "true" };

  document.getElementById("btn-inicio").addEventListener("click", () => {
    window.location.href = "landing_page.html";
  });

  /* ---------------- Menú desplegable (mismo patrón que repositor/cajero) ---------------- */
  const btnMenu = document.getElementById("btn-menu");
  const menuDesplegable = document.getElementById("menu-desplegable");

  btnMenu.addEventListener("click", () => {
    menuDesplegable.classList.toggle("activo");
  });

  document.addEventListener("click", (e) => {
    if (!btnMenu.contains(e.target) && !menuDesplegable.contains(e.target)) {
      menuDesplegable.classList.remove("activo");
    }
  });

  document.getElementById("btn-menu-cerrar-sesion").addEventListener("click", cerrarSesion);
  document.getElementById("btn-cerrar-sesion-ajustes").addEventListener("click", cerrarSesion);

  // Cada rol sólo ve en el menú los módulos a los que tiene acceso real
  // (mismo criterio que exigirSesion() en cada página de rol).
  if (usuarioSesion.rol !== "repositor" && usuarioSesion.rol !== "dueño") {
    document.getElementById("btn-menu-repositor").style.display = "none";
  }
  if (usuarioSesion.rol !== "cajero" && usuarioSesion.rol !== "dueño") {
    document.getElementById("btn-menu-cajero").style.display = "none";
  }
  if (usuarioSesion.rol !== "dueño") {
    document.getElementById("btn-menu-administrador").style.display = "none";
  }

  function mostrarMensaje(elemento, texto, tipo) {
    elemento.textContent = texto;
    elemento.className = `auth-mensaje activo ${tipo}`;
  }

  function ocultarMensaje(elemento) {
    elemento.className = "auth-mensaje";
  }

  /* ================= MI CUENTA ================= */
  document.getElementById("cuenta-nombre").value = usuarioSesion.nombre;
  document.getElementById("cuenta-apellido").value = usuarioSesion.apellido;
  document.getElementById("cuenta-email").textContent = usuarioSesion.email;
  document.getElementById("cuenta-rol").textContent = STOCKIATE_ETIQUETA_ROL[usuarioSesion.rol] || usuarioSesion.rol;
  document.getElementById("sesion-info").textContent = `Sesión iniciada como ${usuarioSesion.email}`;

  const formCuenta = document.getElementById("form-cuenta");
  const mensajeCuenta = document.getElementById("mensaje-cuenta");
  const btnGuardarCuenta = document.getElementById("btn-guardar-cuenta");

  formCuenta.addEventListener("submit", async (e) => {
    e.preventDefault();
    ocultarMensaje(mensajeCuenta);

    const nombre = document.getElementById("cuenta-nombre").value.trim();
    const apellido = document.getElementById("cuenta-apellido").value.trim();
    if (!nombre || !apellido) {
      mostrarMensaje(mensajeCuenta, "Nombre y apellido no pueden quedar vacíos.", "error");
      return;
    }

    btnGuardarCuenta.disabled = true;
    btnGuardarCuenta.textContent = "Guardando...";
    try {
      const resp = await fetch(`${URL_BASE}/actualizar_usuario.php`, {
        method: "POST",
        headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
        body: JSON.stringify({ usuario_id: usuarioSesion.id, nombre, apellido }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        mostrarMensaje(mensajeCuenta, data.mensaje || "No se pudo guardar el perfil.", "error");
        return;
      }
      // Resincroniza localStorage: el resto de la app (header, chatbot,
      // futura integración de voz) sigue leyendo la sesión guardada y no
      // se entera sola de este cambio.
      usuarioSesion = data.usuario;
      guardarUsuarioSesion(usuarioSesion);
      mostrarMensaje(mensajeCuenta, "Perfil actualizado correctamente.", "exito");
    } catch (err) {
      mostrarMensaje(mensajeCuenta, "No se pudo conectar con el servidor.", "error");
    } finally {
      btnGuardarCuenta.disabled = false;
      btnGuardarCuenta.textContent = "Guardar cambios";
    }
  });

  /* ================= SEGURIDAD ================= */
  const formPassword = document.getElementById("form-password");
  const mensajePassword = document.getElementById("mensaje-password");
  const btnCambiarPassword = document.getElementById("btn-cambiar-password");

  formPassword.addEventListener("submit", async (e) => {
    e.preventDefault();
    ocultarMensaje(mensajePassword);

    const passwordActual = document.getElementById("password-actual").value;
    const passwordNueva = document.getElementById("password-nueva").value;
    const passwordConfirmar = document.getElementById("password-nueva-confirmar").value;

    if (passwordNueva.length < 6) {
      mostrarMensaje(mensajePassword, "La contraseña nueva debe tener al menos 6 caracteres.", "error");
      return;
    }
    if (passwordNueva !== passwordConfirmar) {
      mostrarMensaje(mensajePassword, "Las contraseñas no coinciden.", "error");
      return;
    }

    btnCambiarPassword.disabled = true;
    btnCambiarPassword.textContent = "Cambiando...";
    try {
      const resp = await fetch(`${URL_BASE}/cambiar_password.php`, {
        method: "POST",
        headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
        body: JSON.stringify({ usuario_id: usuarioSesion.id, password_actual: passwordActual, password_nueva: passwordNueva }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        mostrarMensaje(mensajePassword, data.mensaje || "No se pudo cambiar la contraseña.", "error");
        return;
      }
      formPassword.reset();
      mostrarMensaje(mensajePassword, "Contraseña actualizada correctamente.", "exito");
    } catch (err) {
      mostrarMensaje(mensajePassword, "No se pudo conectar con el servidor.", "error");
    } finally {
      btnCambiarPassword.disabled = false;
      btnCambiarPassword.textContent = "Cambiar contraseña";
    }
  });

  /* ================= PREFERENCIAS DEL NEGOCIO (sólo dueño) ================= */
  const cardPreferencias = document.getElementById("card-preferencias");

  if (usuarioSesion.rol !== "dueño") {
    cardPreferencias.style.display = "none";
  } else {
    const formConfig = document.getElementById("form-config");
    const mensajeConfig = document.getElementById("mensaje-config");
    const btnGuardarConfig = document.getElementById("btn-guardar-config");
    const inputUmbral = document.getElementById("umbral-vencimiento");

    (async () => {
      try {
        const resp = await fetch(`${URL_BASE}/consultar_configuracion.php`, {
          method: "POST",
          headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const data = await resp.json();
        if (resp.ok && data.ok && data.configuracion && data.configuracion.umbral_dias_vencimiento !== undefined) {
          inputUmbral.value = data.configuracion.umbral_dias_vencimiento;
        }
      } catch (err) {
        mostrarMensaje(mensajeConfig, "No se pudo cargar la configuración actual.", "error");
      }
    })();

    formConfig.addEventListener("submit", async (e) => {
      e.preventDefault();
      ocultarMensaje(mensajeConfig);

      const valor = inputUmbral.value;
      if (valor === "" || Number(valor) < 0 || !Number.isInteger(Number(valor))) {
        mostrarMensaje(mensajeConfig, "Ingresá un número de días válido (0 o más).", "error");
        return;
      }

      btnGuardarConfig.disabled = true;
      btnGuardarConfig.textContent = "Guardando...";
      try {
        const resp = await fetch(`${URL_BASE}/actualizar_configuracion.php`, {
          method: "POST",
          headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
          body: JSON.stringify({ rol: usuarioSesion.rol, clave: "umbral_dias_vencimiento", valor: String(valor) }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          mostrarMensaje(mensajeConfig, data.mensaje || "No se pudo guardar la preferencia.", "error");
          return;
        }
        mostrarMensaje(mensajeConfig, "Preferencia actualizada correctamente.", "exito");
      } catch (err) {
        mostrarMensaje(mensajeConfig, "No se pudo conectar con el servidor.", "error");
      } finally {
        btnGuardarConfig.disabled = false;
        btnGuardarConfig.textContent = "Guardar preferencia";
      }
    });
  }
</script>

<!--
  Gancho para la integración futura con voz (a propósito no implementado
  todavía -- ver docs/ARCHITECTURE.md, "Gaps conocidos"): cuando se
  actualice voz_busqueda.js, agregar

    ajustes: { url: "ajustes.html", roles: null, etiqueta: "Ajustes" }

  al mapa RUTAS (voz_busqueda.js, cerca de la línea 343) y borrar el caso
  especial `if (destino === "ajustes")` de navegarPorDefecto() (cerca de
  la línea 367), que hoy sólo abre el menú desplegable como fallback
  porque no existía esta página.
-->

</body>
</html>
