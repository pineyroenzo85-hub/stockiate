<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stockIAte | Equipo</title>
<link rel="stylesheet" href="styles.css">
<script src="tema.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="auth.js?v=5"></script>
<script>
  // Guardia optimista: sólo el dueño (Administrador) administra el equipo.
  // La contraparte real son listar_equipo.php / crear_invitacion.php, que
  // exigen el rol contra la sesión de servidor.
  var usuarioSesion = exigirSesion(["dueño"]);
</script>
</head>
<body>

<!--
  stockIAte - equipo.html
  ================================
  Pantalla del administrador para sumar gente a SU negocio.

  No manda mails: no hay mailer en este stack. Genera un link de invitación
  que el dueño copia y pasa por donde quiera. El link vence a los 7 días y
  sirve una sola vez.
-->

<div class="app">

<header>
    <div>
        <div class="marca" id="btn-inicio" style="cursor:pointer;">
         stock<em>IA</em>te
         </div>
        <div class="modulo-tag">Equipo</div>
    </div>
    <div class="header-derecha">
        <button type="button" class="toggle-tema" onclick="window.stockiateTema.alternar()" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
          <span class="toggle-tema-knob">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F0EAF7" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
          </span>
        </button>
        <span id="chip-negocio" class="campo-opcional-tag"></span>
        <button id="btn-volver" class="btn">Volver al panel</button>
        <button id="btn-cerrar-sesion" class="btn">Cerrar sesión</button>
    </div>
</header>

<main>
<section class="landing" style="text-align:left;">

    <h1>Tu equipo</h1>
    <p class="sub">Invitá gente a tu negocio. Cada persona entra con el rol que
       le asignes — no lo puede elegir por su cuenta.</p>

    <div id="mensaje" class="auth-mensaje"></div>

    <!-- ===== Invitar ===== -->
    <div class="panel" style="padding:20px; margin-bottom:24px;">
        <h2 style="margin-top:0;">Invitar a alguien</h2>
        <form id="form-invitar" class="auth-form" novalidate>
            <div class="fila-doble">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="off" required>
                </div>
                <div>
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="repositor">Repositor — carga de stock</option>
                        <option value="cajero">Cajero — ventas</option>
                        <option value="dueño">Administrador — panel y estadísticas</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="btn-invitar" class="btn btn-primario">Generar invitación</button>
        </form>
    </div>

    <!-- ===== Invitaciones pendientes ===== -->
    <div class="panel" style="padding:20px; margin-bottom:24px;">
        <h2 style="margin-top:0;">Invitaciones pendientes</h2>
        <div id="lista-invitaciones"><p class="sub">Cargando...</p></div>
    </div>

    <!-- ===== Equipo actual ===== -->
    <div class="panel" style="padding:20px;">
        <h2 style="margin-top:0;">Gente en el negocio</h2>
        <div id="lista-usuarios"><p class="sub">Cargando...</p></div>
    </div>

</section>
</main>

</div>

<script>
document.getElementById("btn-inicio").addEventListener("click", () => {
    window.location.href = "landing_page.html";
});
document.getElementById("btn-volver").addEventListener("click", () => {
    window.location.href = "administrador.html";
});
document.getElementById("btn-cerrar-sesion").addEventListener("click", cerrarSesion);

const mensaje = document.getElementById("mensaje");
const btnInvitar = document.getElementById("btn-invitar");

function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = `auth-mensaje activo ${tipo}`;
}

function escapar(texto) {
    const div = document.createElement("div");
    div.textContent = texto == null ? "" : texto;
    return div.innerHTML;
}

/** El link se arma con el origen actual, no con una URL de configuración:
 *  así funciona igual por localhost que por el túnel de ngrok. */
function linkDeInvitacion(token) {
    return new URL(`invitacion.html?token=${token}`, window.location.href).href;
}

// ===== Carga de datos ================================================
async function cargarEquipo() {
    try {
        const resp = await fetchApi("listar_equipo.php", { method: "POST" });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
            mostrarMensaje(data.mensaje || "No se pudo cargar el equipo.", "error");
            return;
        }

        renderInvitaciones(data.invitaciones);
        renderUsuarios(data.usuarios);
    } catch (err) {
        mostrarMensaje(mensajeDeError(err), "error");
    }
}

function renderInvitaciones(invitaciones) {
    const cont = document.getElementById("lista-invitaciones");

    if (!invitaciones || invitaciones.length === 0) {
        cont.innerHTML = `<p class="sub">No hay invitaciones pendientes.</p>`;
        return;
    }

    cont.innerHTML = invitaciones.map((inv) => `
        <div class="fila-invitacion" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid #252b3d;">
            <div style="flex:1; min-width:200px;">
                <b>${escapar(inv.email)}</b>
                <span class="campo-opcional-tag">${escapar(STOCKIATE_ETIQUETA_ROL[inv.rol] || inv.rol)}</span>
                <div class="sub" style="font-size:.85em; margin:0;">Vence: ${escapar(inv.expira_at)}</div>
            </div>
            <button class="btn" data-copiar="${escapar(inv.token)}">Copiar link</button>
            <button class="btn" data-revocar="${escapar(inv.id)}">Revocar</button>
        </div>
    `).join("");
}

function renderUsuarios(usuarios) {
    const cont = document.getElementById("lista-usuarios");

    if (!usuarios || usuarios.length === 0) {
        cont.innerHTML = `<p class="sub">Todavía no hay nadie más.</p>`;
        return;
    }

    cont.innerHTML = usuarios.map((u) => `
        <div style="display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #252b3d;">
            <div style="flex:1;">
                <b>${escapar(u.nombre)} ${escapar(u.apellido)}</b>
                <span class="campo-opcional-tag">${escapar(STOCKIATE_ETIQUETA_ROL[u.rol] || u.rol)}</span>
                <div class="sub" style="font-size:.85em; margin:0;">${escapar(u.email)}</div>
            </div>
            ${u.id === usuarioSesion.id ? '<span class="campo-opcional-tag">Vos</span>' : ""}
        </div>
    `).join("");
}

// ===== Invitar =======================================================
document.getElementById("form-invitar").addEventListener("submit", async (e) => {
    e.preventDefault();
    mensaje.className = "auth-mensaje";

    const email = document.getElementById("email").value.trim();
    const rol = document.getElementById("rol").value;

    if (!email) {
        mostrarMensaje("Poné el email de la persona que querés invitar.", "error");
        return;
    }

    btnInvitar.disabled = true;
    btnInvitar.textContent = "Generando...";

    try {
        const resp = await fetchApi("crear_invitacion.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, rol }),
        });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
            mostrarMensaje(data.mensaje || "No se pudo crear la invitación.", "error");
            return;
        }

        mostrarMensaje(`Invitación lista. Copiá el link y pasáselo a ${email}.`, "exito");
        document.getElementById("email").value = "";
        cargarEquipo();
    } catch (err) {
        mostrarMensaje(mensajeDeError(err), "error");
    } finally {
        btnInvitar.disabled = false;
        btnInvitar.textContent = "Generar invitación";
    }
});

// ===== Copiar / revocar (delegación de eventos) ======================
document.getElementById("lista-invitaciones").addEventListener("click", async (e) => {
    const btnCopiar = e.target.closest("button[data-copiar]");
    if (btnCopiar) {
        const link = linkDeInvitacion(btnCopiar.dataset.copiar);
        try {
            await navigator.clipboard.writeText(link);
            mostrarMensaje("Link copiado al portapapeles.", "exito");
        } catch (err) {
            // clipboard falla sin HTTPS o sin permiso: mostramos el link para
            // que se pueda copiar a mano.
            mostrarMensaje(`Copialo a mano: ${link}`, "exito");
        }
        return;
    }

    const btnRevocar = e.target.closest("button[data-revocar]");
    if (!btnRevocar) return;

    if (!confirm("¿Seguro que querés revocar esta invitación? El link deja de funcionar.")) {
        return;
    }

    try {
        const resp = await fetchApi("revocar_invitacion.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ invitacion_id: Number(btnRevocar.dataset.revocar) }),
        });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
            mostrarMensaje(data.mensaje || "No se pudo revocar.", "error");
            return;
        }

        mostrarMensaje("Invitación revocada.", "exito");
        cargarEquipo();
    } catch (err) {
        mostrarMensaje(mensajeDeError(err), "error");
    }
});

// ===== Arranque ======================================================
(async () => {
    const usuario = await confirmarSesion(["dueño"]);
    if (!usuario) return;

    usuarioSesion = usuario;
    document.getElementById("chip-negocio").textContent = usuario.negocio_nombre || "";
    cargarEquipo();
})();
</script>

</body>
</html>
