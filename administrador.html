<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stockIAte | Panel de Administrador</title>
<style>
  :root{
    --bg-0:#0b0e14;
    --bg-1:#111520;
    --bg-2:#161b29;
    --bg-3:#1e2436;
    --border:#252b3d;
    --text-hi:#e8eaf2;
    --text-mid:#9aa1b5;
    --text-low:#5c6480;
    --accent:#7c5cff;
    --accent-2:#4dd0e1;
    --ok:#3ddc84;
    --warn:#ffb547;
    --danger:#ff5c72;
    --font: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: var(--font);
    background: radial-gradient(1200px 600px at 20% -10%, #171d2e 0%, var(--bg-0) 55%), var(--bg-0);
    color: var(--text-hi);
    min-height:100vh;
    padding: 24px;
  }
  .app{ max-width:1440px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }

  /* Header */
  .topbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-icon{
    width:40px; height:40px; border-radius:11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#0b0e14;
    box-shadow: 0 0 24px rgba(124,92,255,0.35);
  }
  .brand h1{ font-size:18px; font-weight:700; letter-spacing:-0.02em; }
  .brand span{ display:block; font-size:11.5px; color:var(--text-mid); font-weight:500; }
  .user-chip{
    display:flex; align-items:center; gap:10px; background:var(--bg-2);
    border:1px solid var(--border); padding:7px 14px 7px 7px; border-radius:30px;
  }
  .user-chip .avatar{ width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#ff8a65,#ff5c72); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .user-chip .info{ font-size:12.5px; line-height:1.25; }
  .user-chip .info b{ display:block; font-size:13px; }

  /* KPI Grid */
  .kpi-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; }
  .kpi-card{
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border:1px solid var(--border); border-radius:16px; padding:18px 20px;
    position:relative; overflow:hidden;
  }
  .kpi-card::after{
    content:""; position:absolute; top:-40%; right:-20%; width:140px; height:140px; border-radius:50%;
    background: radial-gradient(circle, var(--kpi-glow, rgba(124,92,255,0.18)), transparent 70%);
  }
  .kpi-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .kpi-label{ font-size:12px; color:var(--text-mid); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kpi-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .kpi-value{ font-size:26px; font-weight:800; margin-top:14px; letter-spacing:-0.02em; }
  .kpi-sub{ font-size:12px; color:var(--text-mid); margin-top:4px; }
  .kpi-sub.ok{ color:var(--ok); }
  .kpi-sub.warn{ color:var(--warn); }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:6px; box-shadow:0 0 8px var(--ok); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;} }

  /* Main grid */
  .main-grid{ display:grid; grid-template-columns: 1fr; gap:20px; align-items:start; }

  @media (max-width: 1080px){
    .kpi-grid{ grid-template-columns: repeat(2,1fr); }
    .main-grid{ grid-template-columns: 1fr; }
  }
  @media (max-width: 560px){
    .kpi-grid{ grid-template-columns: 1fr; }
    body{ padding:14px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand" id="btn-inicio" style="cursor:pointer;">
  <div class="brand-icon">sI</div>
  <div>
    <h1>stockIAte <span style="color:var(--text-mid); font-weight:500;">/ Panel Administrador</span></h1>
    <span>El fin de los códigos de barra. El inicio del stock inteligente.</span>
  </div>
</div>
    <div class="user-chip">
      <div class="avatar">D</div>
      <div class="info"><b>Dueño</b>Perfumería Central</div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="main-grid">
    <!-- Inventario -->
    <div id="inventarioContenedor"></div>
  </div>
</div>

<script src="inventario_tabla.js?v=2"></script>
<script>
/* ---------------- KPIs (datos reales de MySQL vía consultar_inventario.php) ---------------- */
function renderKPIs(datos){
  const ventasHoyMonto = datos.ventas_hoy_monto || 0;
  const ventasHoyUnidades = datos.ventas_hoy_unidades || 0;
  const criticos = datos.criticos || 0;
  const masVendido = datos.producto_mas_vendido;

  const cards = [
    {
      label: "Ventas Estimadas Hoy", value: `$${ventasHoyMonto.toLocaleString('es-AR')}`,
      sub: `≈ ${ventasHoyUnidades} unidades`, subClass:"ok", icon:"💰", glow:"rgba(61,220,132,0.18)"
    },
    {
      label: "Alertas de Stock Crítico", value: criticos,
      sub: criticos > 0 ? `${criticos} producto(s) requieren reposición` : "Todo bajo control",
      subClass: criticos > 0 ? "warn" : "ok", icon:"⚠️", glow:"rgba(255,92,114,0.18)"
    },
    {
      label: "Producto Más Vendido",
      value: masVendido ? masVendido.nombre.split(' ').slice(0,3).join(' ') : "Sin ventas este mes",
      sub: masVendido ? `${masVendido.marca || ''} · ${masVendido.unidades_vendidas} u/mes` : "",
      subClass:"", icon:"🏆", glow:"rgba(124,92,255,0.18)"
    },
    {
      label: "Estado del Servidor IA", value: "Online",
      sub: "Modo simulado · latencia 180ms", subClass:"ok", icon:"🛰️", glow:"rgba(77,208,225,0.18)", pulse:true
    },
  ];

  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card" style="--kpi-glow:${c.glow}">
      <div class="kpi-top">
        <span class="kpi-label">${c.label}</span>
        <span class="kpi-icon">${c.icon}</span>
      </div>
      <div class="kpi-value">${c.pulse ? '<span class="pulse-dot"></span>' : ''}${c.value}</div>
      <div class="kpi-sub ${c.subClass}">${c.sub}</div>
    </div>
  `).join('');
}

/* ---------------- Init ---------------- */
initInventarioTabla(document.getElementById('inventarioContenedor'), {
  onDatos: renderKPIs,
});
</script>
<script>
document.getElementById("btn-inicio").addEventListener("click", () => {
    window.location.href = "landing_page.html";
});
</script>

<script src="chatbot_widget.js?v=2" data-rol="dueño" data-usuario-id="1"></script>

</body>
</html>
