<style>
  /* Mismas variables que styles.css (mismos nombres, mismos valores), pero
     NO se incluye styles.css acá a propósito: sus selectores genéricos
     (input[type="text"], select, etc.) tienen más especificidad que las
     clases invt-/cst-/prf- de los componentes de este panel y les pisarían
     ancho/padding/tamaño de fuente. Ver la nota de "Clases con prefijo" en
     inventario_tabla.js / costos_tabla.js / preferencias.js. */

    color-scheme: light;
    --fondo-grad:   linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #DDD6FE 100%);
    --superficie:   #EDE9FE;
    --glass-bg:     rgba(255, 255, 255, 0.72);
    --glass-border: rgba(124, 58, 237, 0.20);
    --glass-shadow: 0 10px 30px rgba(76, 29, 149, 0.14);
    --divisor:      rgba(27, 23, 64, 0.12);
    --azul-deep:    #F5F3FF;
    --azul-card:    var(--superficie);
    --azul-input:   var(--superficie);
    --azul-acento:  #7C3AED;
    --azul-glow:    #6D28D9;
    --blanco-puro:  #1B1740;
    --crema-clean:  #2E2A55;
    --gris-tenue:   #5F5C80;
    --ok: #047857; --alerta: #92400E; --error: #B91C1C;
    --neu-sombra:       6px 6px 14px rgba(124, 58, 237, 0.16), -6px -6px 14px rgba(255, 255, 255, 0.95);
    --neu-sombra-chica: 4px 4px 10px rgba(124, 58, 237, 0.16), -4px -4px 10px rgba(255, 255, 255, 0.95);
    --neu-inset:        inset 3px 3px 6px rgba(124, 58, 237, 0.16), inset -3px -3px 6px rgba(255, 255, 255, 0.95);
    --lila: #8B5CF6; --lila-dark: #7C3AED; --lila-shadow: rgba(124, 58, 237, 0.40);
    --menta: #A9DCC2; --menta-dark: #6FBF97;
    --dorado: #EFDCAE; --dorado-dark: #C9A23F;
    --coral: #EEBAC3; --coral-dark: #C25A67;
    --ok-bg: rgba(169, 220, 194, 0.55); --ok-border: rgba(111, 191, 151, 0.45);
    --alerta-bg: rgba(239, 220, 174, 0.55);
    --error-bg: rgba(238, 186, 195, 0.55); --error-border: rgba(238, 186, 195, 0.70);
    --lila-tenue: rgba(124, 58, 237, 0.18);
    --gris-tenue-bg: rgba(27, 23, 64, 0.07);
    --texto-sobre-acento: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
  color-scheme: dark;
      --fondo-grad:   linear-gradient(135deg, #0B0F19 0%, #0F172A 55%, #16123A 100%);

      --glass-bg:     rgba(30, 27, 75, 0.62);
      --glass-border: rgba(167, 139, 250, 0.20);
      --glass-shadow: 0 10px 30px rgba(2, 6, 23, 0.55);
      --divisor:      rgba(167, 139, 250, 0.14);
      --azul-deep:    #0B0F19;
      --azul-acento:  #A78BFA;
      --azul-glow:    #C4B5FD;
      --blanco-puro:  #F1F5F9;
      --crema-clean:  #E2E8F0;
      --gris-tenue:   #A5B0C4;
      --ok: #34D399; --alerta: #FBBF24; --error: #F87171;
      --neu-sombra:       6px 6px 14px rgba(2, 6, 23, 0.60), -6px -6px 14px rgba(139, 92, 246, 0.06);
      --neu-sombra-chica: 4px 4px 10px rgba(2, 6, 23, 0.60), -4px -4px 10px rgba(139, 92, 246, 0.06);
      --neu-inset:        inset 3px 3px 6px rgba(2, 6, 23, 0.55), inset -3px -3px 6px rgba(139, 92, 246, 0.06);
      --lila: #8B5CF6; --lila-dark: #7C3AED; --lila-shadow: rgba(2, 6, 23, 0.60);
      --menta: #4FA97D; --menta-dark: #3E8E67;
      --dorado: #E3BE6E; --dorado-dark: #C09A42;
      --coral: #DE7E8A; --coral-dark: #C25462;
      --ok-bg: rgba(126, 214, 164, 0.14); --ok-border: rgba(126, 214, 164, 0.28);
      --alerta-bg: rgba(227, 190, 110, 0.13);
      --error-bg: rgba(244, 134, 143, 0.15); --error-border: rgba(244, 134, 143, 0.32);

  :root[data-tema="oscuro"] {
  color-scheme: dark;
    --fondo-grad:   linear-gradient(135deg, #0B0F19 0%, #0F172A 55%, #16123A 100%);

    --divisor:      rgba(167, 139, 250, 0.14);
    --azul-deep:    #0B0F19;

  *{box-sizing:border-box; margin:0; padding:0;}
  /* Reserva el canal de la barra de scroll siempre. Sin esto, cuando el modal
     del negocio bloquea el scroll del fondo la barra desaparece y toda la
     pagina salta ~15px a la derecha. */
  html{ scrollbar-gutter: stable; }
  body{
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    background: var(--fondo-grad);
    color: var(--blanco-puro);
    min-height:100vh;
    padding: 24px;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .app{ max-width:1440px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }

  /* Header */
  .topbar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 16px 22px;
    box-shadow: var(--glass-shadow);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-icon{
    width:40px; height:40px; border-radius:13px;
    background: linear-gradient(135deg, var(--lila) 0%, var(--menta) 50%, var(--dorado) 100%);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:var(--blanco-puro);
    box-shadow: 0 4px 12px var(--lila-shadow);
  }
  .brand h1{ font-size:18px; font-weight:800; letter-spacing:-0.02em; color: var(--blanco-puro); }
  .brand span{ display:block; font-size:11.5px; color:var(--gris-tenue); font-weight:500; }
  /* Es un <button>: abre el panel de preferencias del negocio
     (menu_negocio.js). Hay que devolverle la tipografia y sacarle el chrome
     nativo que trae el navegador. */
  .user-chip{
    display:flex; align-items:center; gap:10px; background:var(--superficie);
    box-shadow: var(--neu-sombra-chica);
    padding:7px 14px 7px 7px; border-radius:30px;
    border:none; font-family:inherit; color:inherit; text-align:left;
    cursor:pointer; transition:box-shadow .15s, transform .15s;
  }
  .user-chip:hover{ box-shadow: var(--neu-sombra); }
  .user-chip:active{ transform: translateY(1px); }
  .user-chip:focus-visible{ outline:2px solid var(--azul-acento); outline-offset:3px; }
  .user-chip .chevron{ color:var(--gris-tenue); font-size:10px; margin-left:2px; }
  .user-chip .avatar{ width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--coral),var(--coral-dark)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color: var(--blanco-puro); }
  .user-chip .info{ display:block; font-size:12.5px; line-height:1.25; color: var(--gris-tenue); }
  .user-chip .info b{ display:block; font-size:13px; color: var(--blanco-puro); }

  /* Botones "Carteles"/"Equipo"/"Ajustes" de la topbar: administrador.html
     no carga styles.css (ver comentario arriba), así que .btn-texto de ahí
     no existe acá y salían con el chrome blanco por defecto del navegador.
     Mismo acabado neumórfico que .user-chip, al lado del cual viven. */
  .btn-topbar{
    background: var(--superficie);
    box-shadow: var(--neu-sombra-chica);
    border: none;
    border-radius: 30px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gris-tenue);
    cursor: pointer;
    transition: box-shadow .15s, transform .15s, color .15s;
  }
  .btn-topbar:hover{ box-shadow: var(--neu-sombra); color: var(--blanco-puro); }
  .btn-topbar:active{ transform: translateY(1px); }
  .btn-topbar:focus-visible{ outline:2px solid var(--azul-acento); outline-offset:3px; }

  /* Toggle de tema, junto al user-chip */
  .toggle-tema{
    margin-right: 4px; cursor: pointer; width: 46px; height: 26px; border-radius: 20px; position: relative;
    background: var(--superficie); box-shadow: var(--neu-inset); border: none; padding: 0; flex-shrink: 0;
  }
  .toggle-tema-knob{
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--lila) 0%, var(--lila-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25); transition: left 0.25s ease;
  }
  :root[data-tema="oscuro"] .toggle-tema-knob{ left: 23px; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .toggle-tema-knob{ left: 23px; } }
  .toggle-tema-knob svg{ display: none; width: 11px; height: 11px; }
  :root[data-tema="oscuro"] .toggle-tema-knob svg{ display: block; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .toggle-tema-knob svg{ display: block; } }

  /* KPI Grid */
  .kpi-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  .kpi-card{
    background: var(--superficie);
    box-shadow: var(--neu-sombra);
    border-radius:20px; padding:18px 20px;
    position:relative; overflow:hidden;
  }
  .kpi-card::after{
    content:""; position:absolute; top:-40%; right:-20%; width:140px; height:140px; border-radius:50%;
    background: radial-gradient(circle, var(--kpi-glow, rgba(139,92,246,0.18)), transparent 70%);
  }
  .kpi-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .kpi-label{ font-size:12px; color:var(--gris-tenue); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .kpi-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .kpi-value{ font-size:26px; font-weight:800; margin-top:14px; letter-spacing:-0.02em; color: var(--blanco-puro); }
  .kpi-sub{ font-size:12px; color:var(--gris-tenue); margin-top:4px; }
  .kpi-sub.ok{ color:var(--ok); }
  .kpi-sub.warn{ color:var(--alerta); }

  /* Main grid */
  .main-grid{ display:grid; grid-template-columns: 1fr; gap:20px; align-items:start; }

  /* Tres KPI: de tres columnas pasan directo a una, sin el 2+1 con una tarjeta
     huérfana. */
  @media (max-width: 720px){
    .kpi-grid{ grid-template-columns: 1fr; }
  }
  @media (max-width: 560px){
    body{ padding:14px; }
  }
</style>

<script>
/* ---------------- KPIs (datos reales de MySQL vía consultar_inventario.php) ---------------- */
function renderKPIs(datos){
  const ventasHoyMonto = datos.ventas_hoy_monto || 0;
  const ventasHoyUnidades = datos.ventas_hoy_unidades || 0;
  const criticos = datos.criticos || 0;
  const masVendido = datos.producto_mas_vendido;

  const cards = [
    {
      label: "Ventas de hoy", value: `$${ventasHoyMonto.toLocaleString('es-AR')}`,
      sub: `${ventasHoyUnidades} unidades`, subClass:"ok", icon:"💰", glow:"rgba(184,232,206,0.35)"
    },
    {
      label: "Stock crítico", value: criticos,
      sub: criticos > 0 ? "Para reponer" : "Todo en orden",
      subClass: criticos > 0 ? "warn" : "ok", icon:"⚠️", glow:"rgba(242,191,196,0.35)"
    },
    {
      label: "Más vendido del mes",
      value: masVendido ? masVendido.nombre.split(' ').slice(0,3).join(' ') : "Sin ventas",
      sub: masVendido ? `${masVendido.marca ? masVendido.marca + ' · ' : ''}${masVendido.unidades_vendidas} u.` : "",
      subClass:"", icon:"🏆", glow:"rgba(245,227,174,0.35)"
    },
  ];

  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card" style="--kpi-glow:${c.glow}">
      <div class="kpi-top">
        <span class="kpi-label">${c.label}</span>
        <span class="kpi-icon">${c.icon}</span>
      </div>
      <div class="kpi-value">${c.value}</div>
      <div class="kpi-sub ${c.subClass}">${c.sub}</div>
    </div>
  `).join('');
}

/* ---------------- Init ---------------- */
// Se crea primero: las tablas le pasan sus datos por onDatos apenas responden,
// así los gráficos no vuelven a pedir lo que el panel ya trajo.
const graficos = initGraficos(document.getElementById('graficosContenedor'));

// Plegable igual que el inventario: los dos arrancan cerrados para que el
// panel entre de una en la pantalla.
const costosTabla = initCostosTabla(document.getElementById('costosContenedor'), {
  plegable: true,
  onDatos: (datos) => graficos.actualizarRentabilidad(datos),
});
const prediccionQuiebre = initPrediccionQuiebre(document.getElementById('prediccionContenedor'));
const reposicion = initReposicionTabla(document.getElementById('reposicionContenedor'), { plegable: true });
// Las preferencias dejaron de ser un card de la grilla: viven adentro del panel
// que abre el chip de la topbar, y initMenuNegocio() monta initPreferencias()
// recién la primera vez que alguien lo abre.
const menuNegocio = initMenuNegocio(document.getElementById('btn-negocio'));

initInventarioTabla(document.getElementById('inventarioContenedor'), {
  // Plegable sólo acá: en repositor.html esta misma tabla ES la pantalla entera.
  plegable: true,
  // Sólo acá: tabla de 3 columnas + flotante de detalle al hacer click en una
  // fila + paginado de 10. repositor.html sigue con las 5 columnas de siempre.
  vistaDetalle: true,
  onDatos: (datos) => { renderKPIs(datos); graficos.actualizarInventario(datos); },
  // Archivar o restaurar cambia qué productos existen, así que la tabla de
  // costos y la predicción de quiebre (que leen del mismo catálogo por otros
  // endpoints) quedan desfasadas.
  onCambioCatalogo: () => { costosTabla.recargar(); prediccionQuiebre.recargar(); reposicion.recargar(); },
});
</script>
<script>
document.getElementById("btn-inicio").addEventListener("click", () => {
    window.location.href = "landing_page.html";
});

// Pintada SINCRONICA desde el caché de localStorage. El objeto de sesión ya
// trae negocio_nombre (lo escriben iniciar_sesion.php, crear_negocio.php,
// aceptar_invitacion.php y sesion_demo.php), así que el chip nace con el nombre
// real del negocio en vez del literal "Administrador" que después se pisaba.
// Los listeners de Equipo y Cerrar sesión los cablea menu_negocio.js sobre los
// botones del pie del panel.
menuNegocio.pintarSesion(usuarioSesion);
</script>

<script>
  // Capa autoritativa: el servidor confirma (o desmiente) lo que dice el
  // caché de localStorage. Ver auth.js.
  confirmarSesion(["dueño"]).then((usuario) => {
    if (!usuario) return;

    // El negocio pudo haberse renombrado desde otra sesión: el chip se repinta
    // con lo que dice el servidor.
    menuNegocio.pintarSesion(usuario);

    // Y se guarda en el caché. confirmarSesion() sólo reescribe localStorage
    // cuando cambia el rol o el id (ver auth.js), nunca por el nombre del
    // negocio: sin este write-back, un negocio renombrado volvería a mostrar el
    // nombre viejo durante el primer frame de CADA carga, para siempre.
    if (usuario.negocio_nombre !== usuarioSesion.negocio_nombre) {
      guardarUsuarioSesion(usuario);
    }
  });
