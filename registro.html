<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stockIAte | Crear cuenta</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

<header>
    <div>
        <div class="marca" id="btn-inicio" style="cursor:pointer;">
         stock<em>IA</em>te
         </div>
        <div class="modulo-tag">Crear cuenta</div>
    </div>
</header>

<main>
<section class="landing" style="text-align:left;">

    <h1>Creá tu cuenta</h1>
    <p class="sub">Elegí el módulo que vas a usar — de eso depende qué vas a poder ver.</p>

    <div id="mensaje" class="auth-mensaje"></div>

    <form id="form-registro" class="auth-form" novalidate>
        <div class="fila-doble">
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="given-name" required>
            </div>
            <div>
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" autocomplete="family-name" required>
            </div>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
            <span class="campo-opcional-tag" style="margin-left:0;">Mínimo 6 caracteres</span>
        </div>
        <div>
            <label for="password-confirmar">Confirmar contraseña</label>
            <input type="password" id="password-confirmar" name="password-confirmar" autocomplete="new-password" required>
        </div>
        <div>
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
                <option value="" disabled selected>Elegí tu rol</option>
                <option value="repositor">Repositor — carga de stock</option>
                <option value="cajero">Cajero — ventas</option>
                <option value="dueño">Administrador — panel y estadísticas</option>
            </select>
        </div>
        <button type="submit" id="btn-submit" class="btn btn-primario">Crear cuenta</button>
    </form>

    <p class="auth-footer">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>

</section>
</main>

</div>

<script src="auth.js"></script>
<script>
if (obtenerUsuarioSesion()) {
    window.location.href = rutaParaRol(obtenerUsuarioSesion().rol);
}

document.getElementById("btn-inicio").addEventListener("click", () => {
    window.location.href = "landing_page.html";
});

const URL_BASE = "https://atrium-overtime-deluxe.ngrok-free.dev/stockiate/tesis_enzo";
const HEADERS_NGROK = { "ngrok-skip-browser-warning": "true" };

const form = document.getElementById("form-registro");
const mensaje = document.getElementById("mensaje");
const btnSubmit = document.getElementById("btn-submit");

function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = `auth-mensaje activo ${tipo}`;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    mensaje.className = "auth-mensaje";

    const nombre = document.getElementById("nombre").value.trim();
    const apellido = document.getElementById("apellido").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const passwordConfirmar = document.getElementById("password-confirmar").value;
    const rol = document.getElementById("rol").value;

    if (!rol) {
        mostrarMensaje("Elegí un rol para tu cuenta.", "error");
        return;
    }
    if (password.length < 6) {
        mostrarMensaje("La contraseña debe tener al menos 6 caracteres.", "error");
        return;
    }
    if (password !== passwordConfirmar) {
        mostrarMensaje("Las contraseñas no coinciden.", "error");
        return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = "Creando cuenta...";

    try {
        const resp = await fetch(`${URL_BASE}/registrar_usuario.php`, {
            method: "POST",
            headers: { ...HEADERS_NGROK, "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, apellido, email, password, rol }),
        });
        const data = await resp.json();

        if (!resp.ok || !data.ok) {
            mostrarMensaje(data.mensaje || "No se pudo crear la cuenta.", "error");
            return;
        }

        guardarUsuarioSesion(data.usuario);
        mostrarMensaje("Cuenta creada. Redirigiendo...", "exito");
        setTimeout(() => {
            window.location.href = rutaParaRol(data.usuario.rol);
        }, 600);
    } catch (err) {
        mostrarMensaje("No se pudo conectar con el servidor.", "error");
    } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Crear cuenta";
    }
});
</script>

</body>
</html>
