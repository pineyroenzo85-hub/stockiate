/* ============================================================
   LA HOJA
   ============================================================
   Se ve igual en pantalla que impresa: fondo blanco y texto casi negro
   SIEMPRE, sin las variables del tema. Un cartel se ve en papel, y una vista
   previa en modo oscuro no diría nada sobre cómo va a salir.

   Los tamaños van en mm y pt (no en px ni rem) porque la unidad de destino es
   una hoja A4, no una pantalla.
   ============================================================ */
.crt-hoja{
  background:#fff;
  color:#111;
  width:210mm;
  margin:0 auto;
  padding:8mm;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:0;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

.crt-cartel{
  /* La línea de corte: fina y gris, para guiar la tijera sin comerse tinta.
     Los bordes se pisan entre celdas vecinas, así que queda una sola línea. */
  border:1px solid #b8b8b8;
  margin:-0.5px;
  padding:6mm 5mm;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  text-align:center;
  /* Que ningún cartel quede partido entre dos hojas. */
  break-inside:avoid;
  page-break-inside:avoid;
  overflow:hidden;
}

/* Seis por hoja: 3 filas de 2. A4 útil = 297 - 16 de margen = 281mm. */
.crt-hoja[data-por-hoja="6"] .crt-cartel{ height:93.6mm; }
/* Ocho por hoja: 4 filas de 2. */
.crt-hoja[data-por-hoja="8"] .crt-cartel{ height:70.2mm; }

.crt-cartel-marca{
  font-size:12pt;              /* el piso: nada por debajo de 12pt */
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#444;
}
.crt-cartel-nombre{
  font-size:15pt;
  font-weight:800;
  line-height:1.15;
  margin-top:1mm;
}
.crt-hoja[data-por-hoja="8"] .crt-cartel-nombre{ font-size:13.5pt; }

/* EL PRECIO. Tiene que leerse desde dos metros: de ahí los 56pt. */
.crt-cartel-precio{
  font-size:56pt;
  font-weight:800;
  line-height:1;
  letter-spacing:-0.03em;
  white-space:nowrap;
}
.crt-hoja[data-por-hoja="8"] .crt-cartel-precio{ font-size:44pt; }
.crt-cartel-precio small{ font-size:.45em; font-weight:700; vertical-align:.35em; margin-right:.05em; }

.crt-cartel-antes{

  text-decoration:line-through;
  text-decoration-thickness:2px;
  line-height:1;
}
.crt-hoja[data-por-hoja="8"] .crt-cartel-antes{ font-size:16pt; }

/* La banda de OFERTA es negra con texto blanco, no de color: tiene que
   distinguirse igual impresa en escala de grises, que es como imprime la
   mayoría de los comercios. */
.crt-cartel-banda{
  background:#111;
  color:#fff;
  font-size:14pt;
  font-weight:800;
  letter-spacing:.18em;
  padding:1.5mm 6mm;
  width:100%;
  box-sizing:border-box;
  /* Sin esto, el navegador descarta el fondo negro al imprimir y la banda
     sale como texto blanco sobre blanco: invisible. */
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
.crt-hoja[data-por-hoja="8"] .crt-cartel-banda{ font-size:12pt; }

.crt-cartel-vigencia{ font-size:12pt; font-weight:600; color:#333; }
.crt-cartel-sku{ font-size:12pt; color:#666; }

.crt-cartel-cuerpo{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1mm; flex:1; width:100%; }
.crt-cartel-cabeza{ width:100%; }
.crt-cartel-pie{ width:100%; display:flex; flex-direction:column; align-items:center; gap:1mm; }

/* ============================================================
   IMPRESIÓN
   ============================================================ */

    padding:0;

<!--
  stockIAte - carteles.html
  ================================
  Los carteles de precio y de oferta que se pegan en la góndola, listos para
  imprimir en A4.

  CIERRA EL CÍRCULO
  -----------------
  El sistema sabe los precios y sabe qué está en oferta; hasta acá eso vivía
  sólo adentro de la pantalla. Un cartel escrito a mano con un fibrón es
  exactamente el punto donde el inventario digital se desconecta del local.

  POR QUÉ NO USA UNA BIBLIOTECA DE PDF
  ------------------------------------
  Porque no hace falta: con la impresión del navegador alcanza y sobra, y el
  resultado es mejor (el navegador conoce la impresora y el tamaño real del
  papel). El proyecto ya sirve jsPDF desde `vendor/` para el reporte del panel;
  sumarlo acá sería pagar 300 KB para hacer peor algo que `Ctrl+P` hace bien.

  LAS REGLAS DE IMPRESIÓN NO SON LAS DE PANTALLA
  ----------------------------------------------
  - Fondo blanco y texto casi negro SIEMPRE, sin las variables del tema: el
    modo oscuro de la app se chupa un cartucho por hoja.
  - El precio tiene que leerse desde dos metros: 56pt con 6 por hoja, 44pt
    con 8.
  - Nada por debajo de 12pt.
  - Tiene que funcionar en escala de grises, porque la mayoría de los
    comercios imprime en blanco y negro. Por eso la banda de OFERTA es negra
    con texto blanco y no de color, y el precio anterior se distingue por el
    tachado, no por el tono.
-->

<script>
const URL_CRT_CATALOGO = "consultar_carteles.php";
const URL_CRT_OFERTA = "guardar_oferta.php";

let CATALOGO = [];
let HOY = "";
// Los ids elegidos viven en un Set aparte y no como estado del <input>: la
// tabla se repinta al filtrar, y si la selección viviera en el DOM se perdería
// todo lo elegido cada vez que alguien escribe una letra en el buscador.
const ELEGIDOS = new Set();

const $ = (id) => document.getElementById(id);

function escapar(texto) {
  const div = document.createElement("div");
  div.textContent = texto === null || texto === undefined ? "" : String(texto);
  return div.innerHTML;
}

/** $ 12.490  — sin centavos: en un cartel de góndola son ruido. */
function pesos(valor) {
  return Math.round(valor).toLocaleString("es-AR");
}

/** "2026-09-30" -> "30/09" */
function fechaCorta(iso) {
  if (!iso) return "";
  const p = String(iso).split("-");
  return p.length >= 3 ? `${p[2]}/${p[1]}` : iso;
}

function visibles() {
  const q = $("crtBuscar").value.trim().toLowerCase();
  if (!q) return CATALOGO;
  return CATALOGO.filter(p =>
    (p.nombre || "").toLowerCase().includes(q) ||
    (p.marca || "").toLowerCase().includes(q) ||
    (p.sku || "").toLowerCase().includes(q)
  );
}

/* ------------------------------------------------------------------
   La tabla de selección
   ------------------------------------------------------------------ */
function renderTabla() {
  const filas = visibles();
  const tbody = $("crtTbody");

  if (!filas.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="crt-empty">No hay productos que coincidan.</td></tr>`;
    return;
  }

  tbody.innerHTML = filas.map(p => {
    const o = p.oferta;
    const vence = o ? `<span class="crt-vigente">vigente hasta ${fechaCorta(o.hasta)}</span>` : "";

    return `
      <tr data-id="${p.id}">
        <td><input type="checkbox" class="crt-check" data-elegir="${p.id}" ${ELEGIDOS.has(p.id) ? "checked" : ""}></td>
        <td>
          ${escapar(p.nombre)}
          <span class="crt-marca">${escapar([p.marca, p.variante].filter(Boolean).join(" · "))}</span>
        </td>
        <td class="crt-num">$${pesos(p.precio_venta)}</td>
        <td>
          <div class="crt-oferta-campos">
            <input type="number" class="crt-campo" data-precio="${p.id}" min="1" step="1"
                   placeholder="sin oferta" value="${o ? Math.round(o.precio) : ""}">
            <input type="date" class="crt-campo" data-hasta="${p.id}" value="${o ? o.hasta : ""}" min="${HOY}">
          </div>
          ${vence}
        </td>
        <td>
          <button type="button" class="crt-btn" data-guardar="${p.id}">Guardar</button>
        </td>
      </tr>
    `;
  }).join("");

  sincronizarCheckTodos();
}

function sincronizarCheckTodos() {
  const filas = visibles();
  const todos = filas.length > 0 && filas.every(p => ELEGIDOS.has(p.id));
  $("crtCheckTodos").checked = todos;
}

/* ------------------------------------------------------------------
   La hoja
   ------------------------------------------------------------------ */
function renderHoja() {
  const hoja = $("crtHoja");
  // Se respeta el orden del catálogo (categoría, marca, nombre) y no el orden
  // en que se fueron tildando: así los carteles salen agrupados por góndola,
  // que es como se van a pegar.
  const elegidos = CATALOGO.filter(p => ELEGIDOS.has(p.id));

  const porHoja = parseInt($("crtPorHoja").value, 10);
  hoja.dataset.porHoja = porHoja;

  if (!elegidos.length) {
    hoja.innerHTML = "";
    $("crtResumenHoja").textContent = "Todavía no elegiste ningún producto.";
    $("crtImprimir").disabled = true;
    return;
  }

  hoja.innerHTML = elegidos.map(p => {
    const o = p.oferta;
    const precio = o ? o.precio : p.precio_venta;

    return `
      <div class="crt-cartel">
        <div class="crt-cartel-cabeza">
          ${o ? `<div class="crt-cartel-banda">OFERTA</div>` : ""}
          <div class="crt-cartel-marca">${escapar(p.marca || "")}</div>
          <div class="crt-cartel-nombre">${escapar(p.nombre)}</div>
        </div>
        <div class="crt-cartel-cuerpo">
          ${o ? `<div class="crt-cartel-antes">$${pesos(o.precio_anterior)}</div>` : ""}
          <div class="crt-cartel-precio"><small>$</small>${pesos(precio)}</div>
        </div>
        <div class="crt-cartel-pie">
          ${o
            ? `<div class="crt-cartel-vigencia">Válido hasta el ${fechaCorta(o.hasta)}</div>`
            : `<div class="crt-cartel-sku">${escapar(p.sku || "")}</div>`}
        </div>
      </div>
    `;
  }).join("");

  const hojas = Math.ceil(elegidos.length / porHoja);
  const sobran = hojas * porHoja - elegidos.length;
  $("crtResumenHoja").textContent =
    `${elegidos.length} cartel(es) · ${hojas} hoja(s) de A4` +
    (sobran > 0 ? ` · van a quedar ${sobran} lugar(es) vacío(s) en la última.` : ".");
  $("crtImprimir").disabled = false;
}

function repintar() {
  renderTabla();
  renderHoja();
}

/* ------------------------------------------------------------------
   Ofertas
   ------------------------------------------------------------------ */
async function guardarOferta(id) {
  const inputPrecio = document.querySelector(`[data-precio="${id}"]`);
  const inputHasta = document.querySelector(`[data-hasta="${id}"]`);
  const boton = document.querySelector(`[data-guardar="${id}"]`);

  const valor = inputPrecio.value.trim();
  const textoOriginal = boton.textContent;
  boton.disabled = true;
  boton.textContent = "...";

  try {
    const resp = await fetchApi(URL_CRT_OFERTA, {
      method: "POST",
      headers: { ...STOCKIATE_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({
        producto_id: id,
        // Vacío = sacar la oferta. Es el mismo campo para poner y para quitar,
        // así no hace falta un botón de borrar al lado de cada fila.
        precio: valor === "" ? null : Number(valor),
        hasta: inputHasta.value || undefined,
      }),
    });
    const data = await resp.json();

    if (!resp.ok || !data.ok) {
      alert(data.mensaje || "No se pudo guardar la oferta.");
      return;
    }

    const producto = CATALOGO.find(p => p.id === id);
    if (producto) producto.oferta = data.oferta;
    repintar();
  } catch (err) {
    alert(mensajeDeError(err));
  } finally {
    boton.disabled = false;
    boton.textContent = textoOriginal;
  }
}

/* ------------------------------------------------------------------
   Eventos
   ------------------------------------------------------------------ */
// Delegado sobre el tbody: la tabla se repinta entera en cada cambio, así que
// enganchar listeners fila por fila los perdería en el primer repintado.
$("crtTbody").addEventListener("click", (e) => {
  const elegir = e.target.closest("[data-elegir]");
  if (elegir) {
    const id = parseInt(elegir.dataset.elegir, 10);
    if (elegir.checked) ELEGIDOS.add(id); else ELEGIDOS.delete(id);
    sincronizarCheckTodos();
    renderHoja();   // no renderTabla(): repintar acá perdería el foco del click
    return;
  }

  const guardar = e.target.closest("[data-guardar]");
  if (guardar) guardarOferta(parseInt(guardar.dataset.guardar, 10));
});

$("crtCheckTodos").addEventListener("change", (e) => {
  for (const p of visibles()) {
    if (e.target.checked) ELEGIDOS.add(p.id); else ELEGIDOS.delete(p.id);
  }
  repintar();
});

$("crtBuscar").addEventListener("input", renderTabla);

$("crtSoloOfertas").addEventListener("click", () => {
  ELEGIDOS.clear();
  for (const p of CATALOGO) {
    if (p.oferta) ELEGIDOS.add(p.id);
  }
  repintar();
});

$("crtTodos").addEventListener("click", () => {
  for (const p of visibles()) ELEGIDOS.add(p.id);
  repintar();
});

$("crtNinguno").addEventListener("click", () => {
  ELEGIDOS.clear();
  repintar();
});

$("crtPorHoja").addEventListener("change", renderHoja);
$("crtImprimir").addEventListener("click", () => window.print());
$("btnPanel").addEventListener("click", () => { window.location.href = "administrador.html"; });
$("btn-volver").addEventListener("click", () => { window.location.href = "administrador.html"; });

/* ------------------------------------------------------------------
   Carga
   ------------------------------------------------------------------ */
async function cargar() {
  try {
    const resp = await fetchApi(URL_CRT_CATALOGO, {
      method: "POST",
      headers: { ...STOCKIATE_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    const data = await resp.json();

    if (!resp.ok || !data.ok) {
      $("crtSubtitulo").textContent = data.mensaje || "No se pudo cargar el catálogo.";
      return;
    }

    CATALOGO = data.productos;
    HOY = data.hoy;

    $("crtSubtitulo").textContent =
      `${data.total} producto(s) activos · ${data.con_oferta} con oferta vigente`;
    $("crtSoloOfertas").disabled = data.con_oferta === 0;

    // Esto es una limitación real y hay que decirla en pantalla, no sólo en un
    // comentario del código: el cartel lo escribe esta pantalla, pero el
    // precio lo cobra registrar_venta.php desde productos.precio_venta.
    $("crtAvisoCaja").innerHTML = `
      <div class="crt-aviso">
        <b>La oferta es sólo para el cartel.</b> La caja sigue cobrando el precio de lista:
        si ponés un producto en oferta, avisale a quien cobra o cambiale el precio de venta
        desde "Costos y márgenes" en el panel.
      </div>
    `;

    repintar();
  } catch (err) {
    $("crtSubtitulo").textContent = mensajeDeError(err);
  }
}

(async () => {
  const usuario = await confirmarSesion(["dueño"]);
  if (!usuario) return;
  cargar();
})();
</script>
</body>
